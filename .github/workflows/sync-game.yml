name: Sync full game

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy game from cat-evolution-game
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/puma04121990-blip/cat-evolution-game.git /tmp/src
          cp /tmp/src/index.html ./index.html
          mkdir -p assets/source-island-stages
          cp /tmp/src/assets/tiny-skyline-ambient-loop.mp3 ./assets/
          cp /tmp/src/assets/source-island-stages/island-stage-*.png ./assets/source-island-stages/
          cp README-GAMEPUSH.md /tmp/README-GAMEPUSH.md || true
      - name: Commit imported files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Import full GamePush build and assets"
            git push
          fi
